<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="cpFavBallGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="45%" stopColor="#0f172a" />
      <stop offset="85%" stopColor="#090d16" />
      <stop offset="100%" stopColor="#030712" />
    </radialGradient>
    <linearGradient id="cpFavRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="cpFavPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="30%" stopColor="#22d3ee" />
      <stop offset="65%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="cpFavSeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="cpFavGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="cpFavClip">
      <circle cx="50" cy="50" r="43" />
    </clipPath>
  </defs>

  <!-- Outer Neon Ring -->
  <circle cx="50" cy="50" r="47" stroke="url(#cpFavRingGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Ball Body -->
  <circle cx="50" cy="50" r="43" fill="url(#cpFavBallGrad)" stroke="url(#cpFavRingGrad)" stroke-width="2" />

  <!-- Specular Light -->
  <ellipse cx="38" cy="27" rx="16" ry="8" fill="#ffffff" opacity="0.14" transform="rotate(-25 38 27)" />

  <!-- Cricket Seams -->
  <g clip-path="url(#cpFavClip)">
    <path d="M 10 90 Q 50 50 90 10" stroke="url(#cpFavSeamGrad)" stroke-width="5" stroke-opacity="0.3" fill="none" />
    <path d="M 10 90 Q 50 50 90 10" stroke="#0f172a" stroke-width="1.5" fill="none" />
    <!-- Stitch nodes -->
    <g stroke="#34d399" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
      <line x1="20" y1="84" x2="24" y2="80" />
      <line x1="29" y1="75" x2="33" y2="71" />
      <line x1="38" y1="66" x2="42" y2="62" />
      <line x1="58" y1="46" x2="62" y2="42" />
      <line x1="67" y1="37" x2="71" y2="33" />
      <line x1="76" y1="28" x2="80" y2="24" />
    </g>
    <g stroke="#06b6d4" stroke-width="1.8" opacity="0.75" stroke-linecap="round">
      <line x1="16" y1="80" x2="20" y2="76" />
      <line x1="25" y1="71" x2="29" y2="67" />
      <line x1="34" y1="62" x2="38" y2="58" />
      <line x1="62" y1="42" x2="66" y2="38" />
      <line x1="71" y1="33" x2="75" y2="29" />
      <line x1="80" y1="24" x2="84" y2="20" />
    </g>
  </g>

  <!-- Glowing Pulse Waveform -->
  <g filter="url(#cpFavGlow)">
    <path d="M 8 50 L 30 50 L 38 36 L 46 66 L 54 16 L 62 78 L 69 44 L 75 54 L 80 50 L 92 50" 
      stroke="url(#cpFavPulseGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Peak Sparks -->
    <circle cx="54" cy="16" r="3.5" fill="#ffffff" />
    <circle cx="62" cy="78" r="3" fill="#38bdf8" />
    <circle cx="92" cy="50" r="2.5" fill="#10b981" />
  </g>
</svg>