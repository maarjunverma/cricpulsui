<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <!-- CricPuls Official Vector Brand Logo - Copyright (c) 2026 CricPuls -->
  <defs>
    <radialGradient id="cpLogoBallGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="45%" stopColor="#0f172a" />
      <stop offset="85%" stopColor="#090d16" />
      <stop offset="100%" stopColor="#030712" />
    </radialGradient>
    <linearGradient id="cpLogoRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="cpLogoPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="35%" stopColor="#22d3ee" />
      <stop offset="65%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="cpLogoSeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="cpLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="cpLogoBallClip">
      <circle cx="40" cy="40" r="32" />
    </clipPath>
  </defs>

  <!-- Left Emblem Group -->
  <g id="Emblem">
    <!-- Outer Ring -->
    <circle cx="40" cy="40" r="35" stroke="url(#cpLogoRingGrad)" stroke-width="1.5" opacity="0.6" stroke-dasharray="3 2" />
    <!-- Ball Core -->
    <circle cx="40" cy="40" r="32" fill="url(#cpLogoBallGrad)" stroke="url(#cpLogoRingGrad)" stroke-width="2" />
    <ellipse cx="31" cy="24" rx="14" ry="7" fill="#ffffff" opacity="0.12" transform="rotate(-25 31 24)" />

    <!-- Seams -->
    <g clip-path="url(#cpLogoBallClip)">
      <path d="M 12 70 Q 40 40 70 12" stroke="url(#cpLogoSeamGrad)" stroke-width="4.5" stroke-opacity="0.3" fill="none" />
      <path d="M 12 70 Q 40 40 70 12" stroke="#0f172a" stroke-width="1.5" fill="none" />
      <g stroke="#34d399" stroke-width="1.4" opacity="0.65" stroke-linecap="round">
        <line x1="18" y1="67" x2="21" y2="64" />
        <line x1="25" y1="60" x2="28" y2="57" />
        <line x1="31" y1="53" x2="34" y2="50" />
        <line x1="47" y1="36" x2="50" y2="33" />
        <line x1="53" y1="30" x2="56" y2="27" />
        <line x1="59" y1="24" x2="62" y2="21" />
      </g>
      <g stroke="#06b6d4" stroke-width="1.4" opacity="0.65" stroke-linecap="round">
        <line x1="15" y1="63" x2="18" y2="60" />
        <line x1="22" y1="56" x2="25" y2="53" />
        <line x1="28" y1="49" x2="31" y2="46" />
        <line x1="50" y1="33" x2="53" y2="30" />
        <line x1="56" y1="27" x2="59" y2="24" />
        <line x1="62" y1="21" x2="65" y2="18" />
      </g>
    </g>

    <!-- Pulse -->
    <g filter="url(#cpLogoGlow)">
      <path d="M 10 40 L 26 40 L 32 30 L 37 52 L 43 16 L 49 59 L 54 36 L 58 43 L 62 40 L 70 40" 
        stroke="url(#cpLogoPulseGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="43" cy="16" r="2.2" fill="#ffffff" />
      <circle cx="49" cy="59" r="1.8" fill="#38bdf8" />
      <circle cx="70" cy="40" r="1.6" fill="#10b981" />
    </g>
  </g>

  <!-- Typography: CRICAI -->
  <g id="Typography">
    <text x="86" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
      CRIC<tspan fill="#10b981">AI</tspan>
    </text>

    <!-- Tagline: LIVE CRICKET INTELLIGENCE -->
    <text x="88" y="64" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.2" fill="#94a3b8">
      LIVE CRICKET INTELLIGENCE &amp; AI
    </text>

    <!-- LIVE Pulse Pill Badge -->
    <rect x="220" y="27" width="56" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="233" cy="38" r="3.5" fill="#ef4444" />
    <text x="241" y="43" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#34d399">
      LIVE
    </text>
  </g>
</svg>
